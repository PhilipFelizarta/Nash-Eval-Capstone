<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nash-Eval: tournament games</title>
<style>
:root {
	color-scheme: light;
	--page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
	--grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
	--s1: #2a78d6;
	--sq-light: #ece8dc; --sq-dark: #9fae9a; --last: rgba(237,161,0,0.42);
	--check: rgba(227,73,72,0.75); --white-side: #f4f3ee; --black-side: #2b2b29;
}
@media (prefers-color-scheme: dark) {
	:root {
		color-scheme: dark;
		--page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
		--grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
		--s1: #3987e5;
		--sq-light: #c9c4b4; --sq-dark: #74846f; --white-side: #e9e8e2; --black-side: #0f0f0e;
	}
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--s1); }
.top { max-width: 1320px; margin: 0 auto; padding: 16px 16px 0; }
h1 { font-size: 16px; margin: 0 0 2px; }
h2 { font-size: 13px; margin: 0 0 8px; color: var(--ink2); font-weight: 600; }
.sub { color: var(--ink2); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { display: grid; grid-template-columns: 330px auto minmax(300px, 1fr); gap: 16px; padding: 16px; max-width: 1320px; margin: 0 auto; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 12px 14px; }
button, select { font: inherit; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--axis); background: var(--surface); color: var(--ink); cursor: pointer; }
button:hover, select:hover { border-color: var(--muted); }
button:disabled { opacity: .45; cursor: default; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.filters label { font-size: 12px; color: var(--ink2); display: flex; gap: 6px; align-items: center; }

/* game list */
.list { max-height: calc(100vh - 150px); overflow: auto; margin: 0 -14px -12px; }
table.games { width: 100%; border-collapse: collapse; font-size: 13px; }
table.games th { position: sticky; top: 0; background: var(--surface); text-align: left; font-weight: 600; color: var(--ink2); font-size: 11px; padding: 4px 6px; border-bottom: 1px solid var(--grid); }
table.games td { padding: 4px 6px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
table.games td:first-child, table.games th:first-child { padding-left: 14px; }
table.games tr { cursor: pointer; }
table.games tbody tr:hover { background: var(--grid); }
table.games tr.sel { background: color-mix(in srgb, var(--s1) 16%, transparent); }
.res { font-weight: 650; }
.live { display: inline-flex; align-items: center; gap: 5px; color: var(--ink2); }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--s1); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

/* board */
.boardcol { display: flex; flex-direction: column; gap: 8px; }
.player { display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
.player .side { display: inline-block; width: 11px; height: 11px; border-radius: 3px; border: 1px solid var(--muted); margin-right: 6px; vertical-align: -1px; }
.boardrow { display: flex; gap: 8px; }
.evalbar { width: 20px; border-radius: 4px; overflow: hidden; position: relative; background: var(--black-side); border: 1px solid var(--ring); }
.evalbar .w { position: absolute; left: 0; right: 0; background: var(--white-side); transition: height .2s; }
.evalbar .mid { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--muted); }
.board { position: relative; width: min(500px, 86vw); aspect-ratio: 1; border-radius: 6px; overflow: hidden; user-select: none; }
.squares { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; height: 100%; }
.sq { position: relative; display: flex; align-items: center; justify-content: center; }
.sq.l { background: var(--sq-light); } .sq.d { background: var(--sq-dark); }
.sq.last::before, .sq.chk::before { content: ""; position: absolute; inset: 0; }
.sq.last::before { background: var(--last); }
.sq.chk::before { background: radial-gradient(circle, var(--check) 0%, transparent 70%); }
.pc { position: relative; font-size: calc(min(500px, 86vw) / 8 * 0.78); line-height: 1; font-family: "DejaVu Sans", "Segoe UI Symbol", "Noto Sans Symbols2", sans-serif; }
.pc.w { color: #fff; text-shadow: 0 0 1px #000, 0 0 1px #000, 0 0 2px #000; }
.pc.b { color: #111; text-shadow: 0 0 1px #fff8; }
.coord { position: absolute; font-size: 10px; font-weight: 600; color: rgba(11,11,11,0.55); pointer-events: none; }
.coord.f { right: 3px; bottom: 1px; } .coord.r { left: 3px; top: 1px; }
.nav button { min-width: 34px; font-weight: 600; }
.nav { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.nav .ply { margin-left: auto; color: var(--ink2); font-size: 12px; }
.ending { font-size: 12px; color: var(--ink2); }

/* right */
.rightcol { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.evalnow { display: flex; gap: 16px; align-items: baseline; }
.evalnow .big { font-size: 24px; font-weight: 650; }
svg.chart { width: 100%; height: 170px; display: block; }
svg.chart text { fill: var(--muted); font-size: 10px; }
.moves { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; max-height: 300px; overflow: auto; display: grid; grid-template-columns: 38px 1fr 1fr; row-gap: 1px; }
.moves .no { color: var(--muted); }
.moves span.m { cursor: pointer; padding: 1px 5px; border-radius: 4px; }
.moves span.m:hover { background: var(--grid); }
.moves span.m.cur { background: var(--s1); color: #fff; }
#tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--ring); box-shadow: 0 4px 14px rgba(0,0,0,.15); border-radius: 6px; padding: 6px 9px; font-size: 12px; display: none; z-index: 10; white-space: nowrap; }
.empty { color: var(--muted); padding: 20px 0; text-align: center; }
@media (max-width: 1100px) { .wrap { grid-template-columns: 1fr; } .list { max-height: 320px; } }
</style>
</head>
<body>
<div class="top">
	<h1>Tournament games</h1>
	<div class="sub"><span id="summary">loading…</span> · <a href="tournament">Standings &amp; Nash</a> · <a href="train">Training curves</a> · <a href="./">Play the engine</a></div>
	<div class="filters">
		<label>Player <select id="fa"><option value="">any</option></select></label>
		<label>vs <select id="fb"><option value="">any</option></select></label>
		<label>Status <select id="fs"><option value="">all</option><option value="live">live</option><option value="done">finished</option></select></label>
		<label>Result <select id="fr"><option value="">any</option><option>1-0</option><option>0-1</option><option>1/2-1/2</option></select></label>
	</div>
</div>
<div class="wrap">
	<div class="card">
		<h2 id="listtitle">Games</h2>
		<div class="list"><table class="games"><thead><tr><th>#</th><th>White</th><th>Black</th><th>Result</th><th class="num">Plies</th></tr></thead><tbody id="rows"></tbody></table></div>
	</div>
	<div class="boardcol">
		<div class="player" id="ptop"></div>
		<div class="boardrow">
			<div class="evalbar" title="White's expected score from the side that just searched"><div class="w" id="evalw"></div><div class="mid"></div></div>
			<div class="board"><div class="squares" id="squares"></div></div>
		</div>
		<div class="player" id="pbot"></div>
		<div class="nav">
			<button id="bFirst" title="Start (Home)">«</button><button id="bPrev" title="Back (←)">‹</button>
			<button id="bNext" title="Forward (→)">›</button><button id="bLast" title="End (End)">»</button>
			<button id="bPlay" title="Autoplay (space)">Autoplay</button><button id="bFlip" title="Flip (f)">Flip</button>
			<label class="sub"><input type="checkbox" id="follow" checked> follow live</label>
			<span class="ply num" id="plyinfo"></span>
		</div>
		<div class="ending" id="ending"></div>
	</div>
	<div class="rightcol">
		<div class="card">
			<div class="evalnow"><div><div class="big num" id="evalbig">–</div><div class="sub">White's expected score after this move</div></div>
			<div><div class="num" id="evalwho" style="font-weight:600">–</div><div class="sub">searched by</div></div></div>
		</div>
		<div class="card"><h2>White's expected score by ply (each side's own MCTS root value)</h2><svg class="chart" id="chart"></svg></div>
		<div class="card"><h2>Moves</h2><div class="moves" id="moves"></div></div>
	</div>
</div>
<div id="tip"></div>
<script>
const $ = id => document.getElementById(id);
const GLYPH = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };
const params = new URLSearchParams(location.search);
let list = [], game = null, ply = 0, flipped = false, selected = params.has("game") ? +params.get("game") : null, timer = null;
if (params.get("a")) $("fa").dataset.want = params.get("a");
if (params.get("b")) $("fb").dataset.want = params.get("b");

function setHTML(el, html) { if (el._html !== html) { el._html = html; el.innerHTML = html; } }
function showTip(html, ev) {
	const t = $("tip"); t.innerHTML = html; t.style.display = "block";
	t.style.left = Math.min(ev.clientX + 14, innerWidth - t.offsetWidth - 8) + "px"; t.style.top = (ev.clientY + 14) + "px";
}
const hideTip = () => { $("tip").style.display = "none"; };
const short = name => name.replace("epoch_", "ep ");
const pct = v => v == null ? "–" : (100 * v).toFixed(1) + "%";

// ---------- list ----------
function filtered() {
	const a = $("fa").value, b = $("fb").value, st = $("fs").value, res = $("fr").value;
	return list.filter(g => {
		if (a && g.white !== a && g.black !== a) return false;
		if (b && !((g.white === a && g.black === b) || (g.black === a && g.white === b) || (!a && (g.white === b || g.black === b)))) return false;
		if (st === "live" && g.result) return false;
		if (st === "done" && !g.result) return false;
		if (res && g.result !== res) return false;
		return true;
	});
}
function renderList() {
	const rows = filtered();
	$("listtitle").textContent = `Games (${rows.length.toLocaleString()} shown)`;
	if (!rows.length) { setHTML($("rows"), `<tr><td colspan="5" class="empty">${list.length ? "No games match" : "No games yet: they appear after their first move"}</td></tr>`); return; }
	setHTML($("rows"), rows.map(g => `<tr data-id="${g.id}" class="${g.id === selected ? "sel" : ""}"><td class="num">${g.id}</td><td>${short(g.white)}</td><td>${short(g.black)}</td>` +
		`<td>${g.result ? `<span class="res">${g.result === "1/2-1/2" ? "½-½" : g.result}</span>` : `<span class="live">live</span>`}</td><td class="num">${g.plies}</td></tr>`).join(""));
}
$("rows").addEventListener("click", e => { const tr = e.target.closest("tr[data-id]"); if (tr) select(+tr.dataset.id); });
for (const id of ["fa", "fb", "fs", "fr"]) $(id).addEventListener("change", () => { renderList(); syncUrl(); });

function fillModels() {
	const names = [...new Set(list.flatMap(g => [g.white, g.black]))].sort();
	for (const id of ["fa", "fb"]) {
		const sel = $(id);
		if (sel.options.length - 1 === names.length) continue;
		const keep = sel.value || sel.dataset.want || "";
		sel.innerHTML = `<option value="">any</option>` + names.map(n => `<option value="${n}">${short(n)}</option>`).join("");
		sel.value = names.includes(keep) ? keep : "";
	}
}
function syncUrl() {
	const p = new URLSearchParams();
	if (selected != null) p.set("game", selected);
	if ($("fa").value) p.set("a", $("fa").value);
	if ($("fb").value) p.set("b", $("fb").value);
	history.replaceState(null, "", "?" + p.toString());
}

async function pollList() {
	try {
		list = await (await fetch("api/games")).json();
		const live = list.filter(g => !g.result).length, done = list.length - live;
		$("summary").textContent = `${done.toLocaleString()} finished · ${live.toLocaleString()} live`;
		fillModels(); renderList();
		if (selected != null && !game) select(selected);
		else if (selected == null && list.length) {
			const rows = filtered();
			const pick = rows.find(g => !g.result) || rows[0];
			if (pick) select(pick.id);
		}
	} catch (e) { $("summary").textContent = "server unreachable, retrying…"; }
	setTimeout(pollList, 3000);
}

// ---------- game ----------
async function select(id) {
	const changed = id !== selected || !game || game.id !== id;
	selected = id; syncUrl();
	try {
		const g = await (await fetch("api/games/" + id)).json();
		if (g.id !== selected) return;
		const atEnd = !game || game.id !== g.id || ply >= game.moves.length;
		game = g;
		if (changed) ply = g.moves.length;
		else if (atEnd && $("follow").checked) ply = g.moves.length;
		render();
	} catch (e) { /* keep last */ }
	renderList();
}
setInterval(() => { if (game && !game.result && selected === game.id) select(game.id); }, 2000);

function parseFen(fen) {
	const b = {};
	fen.split(" ")[0].split("/").forEach((row, i) => {
		let f = 0;
		for (const ch of row) { if (/\d/.test(ch)) f += +ch; else { b["abcdefgh"[f] + (8 - i)] = ch; f++; } }
	});
	return b;
}
function inCheck(fen, pieces) {
	// Cheap check detection for the highlight: the SAN of the move that produced this position ends in + or #.
	return ply > 0 && /[+#]$/.test(game.sans[ply - 1]);
}
function renderBoard() {
	const fen = game.fens[ply], pieces = parseFen(fen), turn = fen.split(" ")[1];
	const last = ply > 0 ? [game.moves[ply - 1].slice(0, 2), game.moves[ply - 1].slice(2, 4)] : [];
	let kingSq = null;
	if (inCheck(fen, pieces)) for (const [sq, p] of Object.entries(pieces)) if (p === (turn === "w" ? "K" : "k")) kingSq = sq;
	let html = "";
	for (let row = 0; row < 8; row++) for (let col = 0; col < 8; col++) {
		const f = flipped ? 7 - col : col, r = flipped ? row : 7 - row;
		const sq = "abcdefgh"[f] + (r + 1), p = pieces[sq];
		const cls = ["sq", (f + r) % 2 === 0 ? "d" : "l"];
		if (last.includes(sq)) cls.push("last");
		if (sq === kingSq) cls.push("chk");
		let inner = p ? `<span class="pc ${p === p.toUpperCase() ? "w" : "b"}">${GLYPH[p.toLowerCase()]}︎</span>` : "";
		if (row === 7) inner += `<span class="coord f">${"abcdefgh"[f]}</span>`;
		if (col === 0) inner += `<span class="coord r">${r + 1}</span>`;
		html += `<div class="${cls.join(" ")}">${inner}</div>`;
	}
	setHTML($("squares"), html);
}
function playerLine(color) {
	const name = color === "w" ? game.white : game.black;
	const res = game.result, won = res && ((res === "1-0" && color === "w") || (res === "0-1" && color === "b"));
	const tag = !res ? "" : res === "1/2-1/2" ? "½" : won ? "1" : "0";
	return `<span><span class="side" style="background:var(${color === "w" ? "--white-side" : "--black-side"})"></span>${name}</span><span class="num">${tag}</span>`;
}
function render() {
	if (!game) return;
	const n = game.moves.length;
	ply = Math.max(0, Math.min(ply, n));
	renderBoard();
	setHTML($("ptop"), playerLine(flipped ? "w" : "b"));
	setHTML($("pbot"), playerLine(flipped ? "b" : "w"));
	const v = ply > 0 ? game.scores[ply - 1] : 0.5;
	$("evalw").style.height = (100 * v) + "%"; $("evalw").style.bottom = "0";
	if (flipped) { $("evalw").style.bottom = ""; $("evalw").style.top = "0"; } else $("evalw").style.top = "";
	$("evalbig").textContent = ply > 0 ? pct(v) : "–";
	const moverWhite = ply > 0 && game.fens[ply - 1].split(" ")[1] === "w";
	$("evalwho").textContent = ply > 0 ? (moverWhite ? game.white : game.black) : "–";
	const startNo = +game.fens[0].split(" ")[5];
	$("plyinfo").textContent = `ply ${ply} / ${n}` + (game.result ? "" : " · live");
	$("ending").textContent = game.result ? `Result ${game.result === "1/2-1/2" ? "½-½" : game.result} by ${game.ending}.` : `In progress: ${game.white} vs ${game.black}.`;
	$("bFirst").disabled = $("bPrev").disabled = ply === 0;
	$("bNext").disabled = $("bLast").disabled = ply === n;
	renderMoves(startNo);
	renderChart();
}
function renderMoves(startNo) {
	const blackFirst = !game.first_white;
	let html = "", i = 0, no = startNo;
	const cell = k => `<span class="m${k + 1 === ply ? " cur" : ""}" data-ply="${k + 1}">${game.sans[k]}</span>`;
	if (blackFirst && game.sans.length) { html += `<span class="no">${no}.</span><span>…</span>${cell(0)}`; i = 1; no++; }
	for (; i < game.sans.length; i += 2, no++) html += `<span class="no">${no}.</span>${cell(i)}${i + 1 < game.sans.length ? cell(i + 1) : "<span></span>"}`;
	const el = $("moves"), stick = el.scrollTop + el.clientHeight >= el.scrollHeight - 4;
	setHTML(el, html);
	const cur = el.querySelector(".cur");
	if (cur && (stick || ply < game.moves.length)) cur.scrollIntoView({ block: "nearest" });
}
$("moves").addEventListener("click", e => { const m = e.target.closest("[data-ply]"); if (m) { ply = +m.dataset.ply; stopAuto(); render(); } });

function renderChart() {
	const svgEl = $("chart"), W = svgEl.clientWidth || 360, H = 170, L = 34, R = 8, T = 8, B = 20;
	const pts = game.scores, n = Math.max(pts.length, 1);
	const x = i => L + (W - L - R) * (i / n), y = v => T + (H - T - B) * (1 - v);
	let g = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
	for (const v of [0, 0.25, 0.5, 0.75, 1]) {
		g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(${v === 0.5 ? "--axis" : "--grid"})" stroke-width="1"${v === 0.5 ? ' stroke-dasharray="3 3"' : ""}/>`;
		g += `<text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v * 100}%</text>`;
	}
	const step = Math.max(10, Math.ceil(n / 8 / 10) * 10);
	for (let i = 0; i <= n; i += step) g += `<text x="${x(i)}" y="${H - 5}" text-anchor="middle">${i}</text>`;
	if (pts.length) {
		const d = [[0, 0.5], ...pts.map((v, i) => [i + 1, v])].map(([i, v], k) => `${k ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
		g += `<path d="${d}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>`;
	}
	g += `<line x1="${x(ply)}" x2="${x(ply)}" y1="${T}" y2="${H - B}" stroke="var(--ink2)" stroke-width="1"/>`;
	if (ply > 0) g += `<circle cx="${x(ply)}" cy="${y(pts[ply - 1])}" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>`;
	g += `<line id="hair" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-width="1" style="display:none"/>`;
	g += `<rect id="hit" x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent" style="cursor:pointer"/></svg>`;
	svgEl.innerHTML = g.replace(/^<svg[^>]*>|<\/svg>$/g, "");
	svgEl.setAttribute("viewBox", `0 0 ${W} ${H}`);
	const hit = svgEl.querySelector("#hit"), hair = svgEl.querySelector("#hair");
	const at = ev => { const r = svgEl.getBoundingClientRect(); return Math.max(0, Math.min(pts.length, Math.round((ev.clientX - r.left - L) / (W - L - R) * n))); };
	hit.onmousemove = ev => {
		const i = at(ev);
		hair.setAttribute("x1", x(i)); hair.setAttribute("x2", x(i)); hair.style.display = "";
		showTip(i === 0 ? "start position" : `ply ${i} · <b>${game.sans[i - 1]}</b><br>White ${pct(pts[i - 1])}`, ev);
	};
	hit.onmouseleave = () => { hair.style.display = "none"; hideTip(); };
	hit.onclick = ev => { ply = at(ev); stopAuto(); render(); };
}

// ---------- navigation ----------
const go = p => { if (game) { ply = p; render(); } };
$("bFirst").onclick = () => { stopAuto(); go(0); };
$("bPrev").onclick = () => { stopAuto(); go(ply - 1); };
$("bNext").onclick = () => { stopAuto(); go(ply + 1); };
$("bLast").onclick = () => { stopAuto(); go(game ? game.moves.length : 0); };
$("bFlip").onclick = () => { flipped = !flipped; render(); };
function stopAuto() { if (timer) { clearInterval(timer); timer = null; $("bPlay").textContent = "Autoplay"; } }
$("bPlay").onclick = () => {
	if (timer) return stopAuto();
	if (game && ply >= game.moves.length) ply = 0;
	$("bPlay").textContent = "Pause";
	timer = setInterval(() => { if (!game || ply >= game.moves.length) return stopAuto(); go(ply + 1); }, 600);
};
addEventListener("keydown", e => {
	if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
	if (e.key === "ArrowLeft") $("bPrev").click();
	else if (e.key === "ArrowRight") $("bNext").click();
	else if (e.key === "Home") $("bFirst").click();
	else if (e.key === "End") $("bLast").click();
	else if (e.key === " ") { e.preventDefault(); $("bPlay").click(); }
	else if (e.key === "f") $("bFlip").click();
	else return;
});
addEventListener("resize", () => game && renderChart());
pollList();
</script>
</body>
</html>
